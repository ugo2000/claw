name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Create .env file
        shell: bash
        run: |
          # Try secrets first, fallback to hardcoded values for CI
          DEEPSEEK_KEY="${{ secrets.DEEPSEEK_API_KEY }}"
          SERP_KEY="${{ secrets.SERP_API_KEY }}"
          # Fallback to hardcoded if secrets not configured
          if [ -z "$DEEPSEEK_KEY" ]; then
            DEEPSEEK_KEY="sk-e261c9efb9bc41a5b615b2609ce3fc4a"
          fi
          if [ -z "$SERP_KEY" ]; then
            SERP_KEY="5d15ea1c5bfe916160a769c67bd61715315b9f443ebd2ea98eb57c15c74911de"
          fi
          echo "VITE_DEEPSEEK_API_KEY=${DEEPSEEK_KEY}" > .env
          echo "VITE_SERP_API_KEY=${SERP_KEY}" >> .env
          echo ".env created:"
          cat .env | sed 's/=.*/=***/'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform (Capacitor)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "android/ already exists, skipping cap add"
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Register NativeHttp plugin in capacitor.plugins.json
        run: |
          python3 - << 'PYEOF'
          import json, os

          PLUGINS_FILE = "android/app/src/main/assets/capacitor.plugins.json"
          os.makedirs(os.path.dirname(PLUGINS_FILE), exist_ok=True)

          # Read existing plugins
          if os.path.exists(PLUGINS_FILE):
              with open(PLUGINS_FILE, "r") as f:
                  plugins = json.load(f)
          else:
              plugins = []

          # Check if NativeHttp is already registered
          exists = any(p.get("pkg") == "NativeHttp" for p in plugins)
          if not exists:
              plugins.append({
                  "pkg": "NativeHttp",
                  "classpath": "com.ugoclaw.app.plugins.NativeHttp"
              })
              with open(PLUGINS_FILE, "w") as f:
                  json.dump(plugins, f, indent=2)
              print("Added NativeHttp to capacitor.plugins.json")
          else:
              print("NativeHttp already in capacitor.plugins.json")
          PYEOF

      - name: Inject NativeHttp plugin (Android)
        shell: bash
        run: |
          # 1. Copy NativeHttp.java
          PLUGIN_DIR="android/app/src/main/java/com/ugoclaw/app/plugins"
          mkdir -p "$PLUGIN_DIR"
          if [ -f "NativeHttp.java.template" ]; then
            cp NativeHttp.java.template "$PLUGIN_DIR/NativeHttp.java"
            echo "NativeHttp.java copied from template"
          else
            echo "ERROR: NativeHttp.java.template not found!"
            exit 1
          fi

          # 2. Patch MainActivity.java to call registerPlugin(NativeHttp.class)
          MAIN_ACTIVITY="android/app/src/main/java/com/ugoclaw/app/MainActivity.java"
          cat > "$MAIN_ACTIVITY" << 'JAVA'
          package com.ugoclaw.app;

          import com.getcapacitor.BridgeActivity;
          import com.ugoclaw.app.plugins.NativeHttp;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(android.os.Bundle savedInstanceState) {
                  registerPlugin(NativeHttp.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
          # Remove leading whitespace caused by heredoc indentation
          sed -i 's/^          //' "$MAIN_ACTIVITY"
          echo "MainActivity.java patched with registerPlugin(NativeHttp.class)"

      - name: Apply Android network security config
        run: |
          python3 - << 'PYEOF'
          import os, re

          # 1. Create network_security_config.xml
          xml_dir = "android/app/src/main/res/xml"
          os.makedirs(xml_dir, exist_ok=True)
          config_path = os.path.join(xml_dir, "network_security_config.xml")
          config_content = """<?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <domain-config cleartextTrafficPermitted="true">
                  <domain includeSubdomains="true">localhost</domain>
                  <domain includeSubdomains="true">10.0.2.2</domain>
              </domain-config>
              <domain-config>
                  <domain includeSubdomains="true">serpapi.com</domain>
                  <domain includeSubdomains="true">api.deepseek.com</domain>
                  <trust-anchors>
                      <certificates src="system" />
                  </trust-anchors>
              </domain-config>
          </network-security-config>
          """
          with open(config_path, "w", encoding="utf-8") as f:
              f.write(config_content)
          print(f"Created: {config_path}")

          # 2. Patch AndroidManifest.xml to add networkSecurityConfig
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              content = f.read()
          if "networkSecurityConfig" not in content:
              content = content.replace(
                  "<application",
                  '<application android:networkSecurityConfig="@xml/network_security_config"',
                  1
              )
              with open(manifest_path, "w", encoding="utf-8") as f:
                  f.write(content)
              print("Patched AndroidManifest.xml with networkSecurityConfig")
          else:
              print("networkSecurityConfig already present, skipping patch")
          PYEOF

      - name: Install Pillow for icon generation
        run: pip install pillow -q

      - name: Generate & install icons
        run: |
          python3 << 'EOF'
          from PIL import Image
          import os, shutil

          SRC = "res/icons-android/icon-1024.png"
          if not os.path.exists(SRC):
              # fallback to any png in icons dir
              for f in os.listdir("res/icons-android"):
                  if f.endswith(".png") and "1024" in f:
                      SRC = f"res/icons-android/{f}"
                      break
              else:
                  # use ic_launcher as source
                  SRC = "res/icons-android/ic_launcher.png"

          src = Image.open(SRC).convert("RGBA")
          src = src.resize((1024, 1024), Image.LANCZOS)
          print(f"Icon source: {SRC} {src.size}")

          # Android mipmap sizes -> target directories
          TARGETS = [
              ("res/icons-android/mipmap-mdpi.png",     "android/app/src/main/res/mipmap-mdpi",    48,  "ic_launcher.png"),
              ("res/icons-android/mipmap-hdpi.png",     "android/app/src/main/res/mipmap-hdpi",    72,  "ic_launcher.png"),
              ("res/icons-android/mipmap-xhdpi.png",    "android/app/src/main/res/mipmap-xhdpi",   96,  "ic_launcher.png"),
              ("res/icons-android/mipmap-xxhdpi.png",   "android/app/src/main/res/mipmap-xxhdpi",  144, "ic_launcher.png"),
              ("res/icons-android/mipmap-xxxhdpi.png",  "android/app/src/main/res/mipmap-xxxhdpi", 192, "ic_launcher.png"),
          ]

          for _src, dest_dir, size, dest_name in TARGETS:
              os.makedirs(dest_dir, exist_ok=True)
              icon = src.resize((size, size), Image.LANCZOS)
              # Save as RGB PNG (no alpha channel issues)
              bg = Image.new("RGB", (size, size), (26, 86, 219))
              if icon.mode == "RGBA":
                  bg.paste(icon, mask=icon.split()[3])
              else:
                  bg.paste(icon)
              dest_path = os.path.join(dest_dir, dest_name)
              bg.save(dest_path, "PNG")
              print(f"  {dest_dir}/{dest_name} ({size}x{size})")
              # Also copy round icon
              bg.save(os.path.join(dest_dir, "ic_launcher_round.png"), "PNG")
              bg.save(os.path.join(dest_dir, "ic_launcher_foreground.png"), "PNG")

          print("All icons installed!")
          EOF

      - name: Make gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        working-directory: ./android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 90

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
